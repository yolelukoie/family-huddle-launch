    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #FBFAF6; color: #1C1B18; font-family: Inter, system-ui, sans-serif; }
      a { color: #1F5A43; }
      @media (prefers-color-scheme: dark) { body { background: #161513; color: #F1EDE4; } a { color: #4ED39B; } }
    </style>
  </head>
  <body>
    <p>Taking you to Yuston… <a id="continue" href="/yourlangcoach">Continue</a></p>
  <script>
      // One static page serves every teacher code: /yourlangcoach/t/?c=CODE
      // Crawlers read the meta tags above; humans are forwarded to the app page.
      (function () {
        var code = new URLSearchParams(window.location.search).get("c") || "";
        code = code.trim().toUpperCase().replace(/[^A-Z0-9-]/g, "");
        var target = code ? "/yourlangcoach/t/" + encodeURIComponent(code) : "/yourlangcoach";
        var meta = document.createElement("meta");
        meta.httpEquiv = "refresh";
        meta.content = "0; url=" + target;
        document.head.appendChild(meta);
        document.getElementById("continue").href = target;
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
