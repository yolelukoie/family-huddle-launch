  <body>
    <p>Taking you to YourLangCoach… <a id="continue" href="/yourlangcoach">Continue</a></p>
  <script>
      // One static page serves every teacher code: /yourlangcoach/t/?c=CODE
      // Crawlers read the meta tags above; humans are forwarded to the app page.
      (function () {
        var code = new URLSearchParams(window.location.search).get("c") || "";
        code = code.trim().toUpperCase().replace(/[^A-Z0-9-]/g, "");
        var target = code ? "/yourlangcoach/t/" + encodeURIComponent(code) : "/yourlangcoach";
        var meta = document.createElement("meta");
        meta.httpEquiv = "refresh";
        meta.content = "0; url=" + target;
        document.head.appendChild(meta);
        document.getElementById("continue").href = target;
        window.location.replace(target);
      })();
    </script>
  </body>
